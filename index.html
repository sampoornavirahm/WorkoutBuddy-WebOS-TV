<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#080b12">
    <title>Workout Buddy</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="Main navigation">
        <a class="brand" href="#" aria-label="Workout Buddy home" data-nav-home>
          <span class="brand-mark" aria-hidden="true">W</span>
          <span class="brand-name">workout<span>buddy</span></span>
        </a>

        <nav class="primary-nav" aria-label="Main">
          <button class="nav-item" type="button" data-page="search" aria-current="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.4"></circle><path d="m16 16 4.2 4.2"></path></svg>
            <span>Search</span>
          </button>
          <button class="nav-item is-active" type="button" data-page="home" aria-current="page">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10.8 9-7.2 9 7.2v9.3a1.9 1.9 0 0 1-1.9 1.9H4.9A1.9 1.9 0 0 1 3 20.1z"></path><path d="M9 22v-8h6v8"></path></svg>
            <span>Home</span>
          </button>
          <button class="nav-item" type="button" data-page="routines" aria-current="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5H5.5A2.5 2.5 0 0 0 3 7.5v11A2.5 2.5 0 0 0 5.5 21h13a2.5 2.5 0 0 0 2.5-2.5v-11A2.5 2.5 0 0 0 18.5 5H16"></path><path d="M8 3h8v5H8zM7.5 13h9M7.5 17h6"></path></svg>
            <span>Routines</span>
          </button>
          <button class="nav-item" type="button" data-page="library" aria-current="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4.8A2.8 2.8 0 0 1 6.8 2H20v16H6.8A2.8 2.8 0 0 0 4 20.8z"></path><path d="M4 5v16h14a2 2 0 0 0 2-2M8 6h8M8 10h8"></path></svg>
            <span>Library</span>
          </button>
          <button class="nav-item" type="button" data-page="settings" aria-current="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="m19.4 15 .1.1 1.4 1.1-1.4 2.4-1.7-.6a7.8 7.8 0 0 1-1.8 1l-.3 1.8h-2.8l-.3-1.8a7.8 7.8 0 0 1-1.8-1l-1.7.6-1.4-2.4 1.4-1.2a7.8 7.8 0 0 1 0-2l-1.4-1.1 1.4-2.4 1.7.6a7.8 7.8 0 0 1 1.8-1l.3-1.8h2.8l.3 1.8a7.8 7.8 0 0 1 1.8 1l1.7-.6 1.4 2.4-1.4 1.2a7.8 7.8 0 0 1 0 1.9Z" transform="translate(-1 -1)"></path></svg>
            <span>Settings</span>
          </button>
        </nav>

        <div class="sidebar-bottom">
          <div class="profile-avatar" aria-hidden="true">Y</div>
          <div class="profile-copy"><span>YOUR SPACE</span><strong>Move at your pace</strong></div>
        </div>
      </aside>

      <main class="main-content">
        <header class="page-topbar">
          <p class="topbar-message" id="topbar-message">A little movement goes a long way.</p>
          <div class="topbar-status"><span class="status-dot"></span> READY WHEN YOU ARE</div>
        </header>
        <section class="page-content" id="page-content" aria-live="polite" tabindex="-1"></section>
      </main>
    </div>

    <dialog class="session-dialog" id="session-dialog" aria-labelledby="dialog-title">
      <button class="dialog-close" type="button" aria-label="Close workout details">×</button>
      <p class="eyebrow" id="dialog-category">YOUR NEXT SESSION</p>
      <h2 id="dialog-title">Workout</h2>
      <p class="dialog-description" id="dialog-description"></p>
      <div class="dialog-meta">
        <span id="dialog-duration"></span>
        <span id="dialog-level"></span>
      </div>
      <p class="session-timer" id="session-timer" role="status" aria-live="polite" hidden></p>
      <div class="dialog-actions">
        <button class="save-button" id="save-button" type="button" aria-pressed="false">♡ <span>Save</span></button>
        <button class="start-button" type="button" id="start-button">Start session <span aria-hidden="true">→</span></button>
      </div>
      <p class="dialog-note" id="dialog-note">Take it at your own pace. You’ve got this.</p>
    </dialog>

    <script src="app.js"></script>
  </body>
</html>
